workflows:
  android-release:
    name: Science World A1 Android
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      flutter: 3.47.9
      java: 17
      android_signing:
        - science_world_upload_keystore
      vars:
        SUPABASE_URL: "https://faiituujosrsthdrsefw.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "sb_publishable_oxs3N5EAiq7zfMH7_gPbgg_F3i6oerr"

    scripts:
      - name: Verify Android build tooling
        script: |
          set -euo pipefail
          bash scripts/prepare_android_wrapper.sh
          bash scripts/ensure_android_sdk.sh
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Validate source, bundled data, and build configuration
        script: |
          set -euo pipefail
          python3 scripts/validate_project.py
          node --check supabase/functions/ai-chat/index.js

      - name: Install dependencies and analyze
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

      - name: Verify Release signing identity
        script: |
          set -euo pipefail
          bash scripts/verify_android_signing.sh

      - name: Build signed Release APK and App Bundle
        script: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Release APK and App Bundle signatures
        script: |
          set -euo pipefail
          bash scripts/verify_release_artifacts.sh

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
