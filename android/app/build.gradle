plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '25'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '2.2.3'

def releaseSigning = [
    CM_KEYSTORE_PATH: System.getenv('CM_KEYSTORE_PATH')?.trim(),
    CM_KEYSTORE_PASSWORD: System.getenv('CM_KEYSTORE_PASSWORD')?.trim(),
    CM_KEY_ALIAS: System.getenv('CM_KEY_ALIAS')?.trim(),
    CM_KEY_PASSWORD: System.getenv('CM_KEY_PASSWORD')?.trim()
]
def missingReleaseSigningValues = releaseSigning
    .findAll { name, value -> !value }
    .keySet()
    .toList()
def releaseKeystoreFile = releaseSigning.CM_KEYSTORE_PATH
    ? file(releaseSigning.CM_KEYSTORE_PATH)
    : null
if (releaseKeystoreFile == null || !releaseKeystoreFile.isFile() || !releaseKeystoreFile.canRead()) {
    if (!missingReleaseSigningValues.contains('CM_KEYSTORE_PATH')) {
        missingReleaseSigningValues.add('CM_KEYSTORE_PATH (readable keystore file required)')
    }
}
def releaseSigningConfigured = missingReleaseSigningValues.isEmpty()

android {
    namespace "com.scienceworld.science_world"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.scienceworld.science_world"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias releaseSigning.CM_KEY_ALIAS
                keyPassword releaseSigning.CM_KEY_PASSWORD
                storeFile releaseKeystoreFile
                storePassword releaseSigning.CM_KEYSTORE_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Fail only when a Release variant is actually built; Debug builds remain usable.
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                "Release signing is not configured. Provide the Codemagic Android signing identity. " +
                "Missing or invalid: ${missingReleaseSigningValues.join(', ')}. Debug signing is never used for Release."
            )
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(verifyReleaseSigning)
}

flutter {
    source '../..'
}

dependencies {}
